name: Rust Test

on:
  workflow_call:
    inputs:
      path:
        required: false
        type: string
        default: './'
      name:
        required: true
        type: string
      runs-on:
        required: false
        type: string
        default: "['ubuntu-latest', 'macos-latest']"
      needs-libpcap:
        required: false
        type: boolean
        default: false
      needs-capnp:
        required: false
        type: boolean
        default: false
      no-default-features: # Pass --no-default-features to every cargo invocation
        required: false
        type: boolean
        default: false
    secrets:
      ZPR_CICD_RO_TOKEN:
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  test:
    name: "Test [${{ matrix.os }}]"
    strategy:
      matrix:
        os: ${{ fromJson(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.ZPR_CICD_RO_TOKEN }}
        submodules: 'true'
      # Necessary to run before rust-cache
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      with:
        workspaces: |
          adapter/ph
          adapter/cli
          zpr-ext
          cslab
          cbpf-rs

    - name: Setup Git credentials
      timeout-minutes: 1
      # bash explicitly: this step's syntax (chmod, redirects) is not pwsh,
      # and the Windows runner's default shell is pwsh.
      shell: bash
      run: |
        echo 'echo $ZPR_CICD_RO_TOKEN' > "$HOME/.git-askpass"
        chmod +x "$HOME/.git-askpass"
        echo "GIT_ASKPASS=$HOME/.git-askpass" >> "$GITHUB_ENV"

    - name: Install libpcap-dev
      if: ${{ inputs.needs-libpcap && runner.os == 'Linux' }}
      timeout-minutes: 5
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo apt install libpcap-dev

    - name: Install capnp [Linux]
      if: ${{ inputs.needs-capnp && runner.os == 'Linux' }}
      timeout-minutes: 5
      run: |
        sudo apt install capnproto

    - name: Install capnp [macOS]
      if: ${{ inputs.needs-capnp && runner.os == 'macOS' }}
      timeout-minutes: 5
      run: |
        brew install capnp

    - name: Install capnp [Windows]
      if: ${{ inputs.needs-capnp && runner.os == 'Windows' }}
      timeout-minutes: 5
      run: choco install -y capnproto

    # aws-lc-sys needs NASM on Windows MSVC (CMake is preinstalled on
    # windows-latest). choco does not shim nasm.exe, so add its install
    # directory to the PATH for later steps.
    - name: Install NASM [Windows]
      if: ${{ runner.os == 'Windows' }}
      timeout-minutes: 5
      run: |
        choco install -y nasm
        Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}-${{ matrix.os }}

    - name: Unpack artifacts
      working-directory: ./
      run: tar -xvf ${{ inputs.name }}.tar

    - name: Test ${{ inputs.name }}
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: cargo test --verbose ${{ inputs.no-default-features && '--no-default-features' || '' }}

    - name: Check format
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      run: cargo fmt --check

    - name: Check warnings
      if: ${{ ! cancelled() }}
      timeout-minutes: 5
      env:
        ZPR_CICD_RO_TOKEN: ${{ secrets.ZPR_CICD_RO_TOKEN }}
      run: cargo build --all-targets ${{ inputs.no-default-features && '--no-default-features' || '' }} --config 'build.rustflags = ["-D", "warnings"]'
